<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUNKER — Aktiv Qobiliyatli Maxsus Kartalar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@600;800&family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#131309;
    --bg-panel:#201f16;
    --metal:#34331f;
    --metal-light:#454330;
    --amber:#d9a441;
    --amber-bright:#f0c064;
    --rust:#a83a2a;
    --paper:#e9e2c9;
    --paper-dim:#a7a184;
    --line:#4a4830;
    --special-card:#8541d9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{min-height:100%; width:100%;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(217,164,65,0.06), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(133,65,217,0.08), transparent 50%),
      var(--bg-deep);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:20px 16px 50px;
    overflow-x:hidden;
  }
  .stencil{ font-family:'Big Shoulders Stencil', sans-serif; letter-spacing:0.02em; }
  .oswald{ font-family:'Oswald', sans-serif; }

  .hazard{
    height:8px; width:100%; max-width:600px;
    background:repeating-linear-gradient(135deg, var(--amber) 0 16px, #1a1a10 16px 32px);
    border-radius:2px; box-shadow:0 0 0 1px #000 inset; margin:0 auto;
  }

  header{ width:100%; max-width:900px; text-align:center; margin-bottom:16px; }
  .eyebrow{ color:var(--amber); font-size:11px; letter-spacing:0.25em; text-transform:uppercase; margin-top:8px; margin-bottom:4px; }
  h1.title{
    font-size:clamp(40px, 8vw, 76px); line-height:0.9; color:var(--paper);
    -webkit-text-stroke:1px rgba(217,164,65,0.25); text-shadow:0 4px 0 rgba(0,0,0,0.45); margin-bottom:6px;
  }
  .subtitle{ color:var(--paper-dim); font-size:13px; max-width:520px; margin:6px auto 0; line-height:1.4; padding:0 8px; }

  .wheel-wrap{ display:flex; justify-content:center; margin:10px 0; width:100%; }
  .wheel{ width:70px; height:70px; transition:transform 1.4s cubic-bezier(.65,0,.35,1); }
  .wheel.spin{ transform:rotate(540deg); }

  #app { width: 100%; display: flex; flex-direction: column; align-items: center; }

  .panel{
    width:100%; max-width:580px;
    background:linear-gradient(180deg, var(--bg-panel), #1a1910);
    border:1px solid var(--line); border-radius:6px; padding:22px 18px; margin-top:10px;
    position:relative; box-shadow:0 15px 30px -15px rgba(0,0,0,0.6);
  }
  .panel::before{
    content:''; position:absolute; inset:5px; border:1px dashed rgba(217,164,65,0.18); border-radius:3px; pointer-events:none;
  }
  .panel-label{
    position:absolute; top:-9px; left:16px; background:var(--bg-deep); padding:0 6px;
    color:var(--amber); font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
  }

  .keypad{ display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-top:6px; }
  .key{
    aspect-ratio:1/1; background:linear-gradient(180deg, var(--metal-light), var(--metal));
    border:1px solid #58553a; border-radius:5px; color:var(--paper);
    font-family:'Oswald', sans-serif; font-size:24px; font-weight:600; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; transition:transform .12s, box-shadow .12s, background .12s;
    box-shadow:0 3px 0 #17160d, 0 5px 8px rgba(0,0,0,0.35);
  }
  .key:active{ transform:translateY(2px); box-shadow:0 1px 0 #17160d; }
  .key.active{
    background:linear-gradient(180deg, var(--amber-bright), var(--amber)); color:#211b08;
    box-shadow:0 3px 0 #7a5c1c, 0 0 0 2px var(--amber-bright);
  }
  .key .tag{ font-size:8px; letter-spacing:0.05em; font-family:'IBM Plex Mono',monospace; color:inherit; opacity:0.7; }

  .go-btn, .continue-btn, .winner-btn, .action-btn{
    width:100%; margin-top:12px; padding:12px;
    background:linear-gradient(180deg, var(--rust), #7c281c); border:1px solid #5c1d13;
    border-radius:5px; color:var(--paper); font-family:'Oswald', sans-serif;
    font-size:15px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer;
    box-shadow:0 4px 0 #4a160e, 0 8px 14px rgba(0,0,0,0.35);
  }
  .go-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .continue-btn, .winner-btn{
    background:linear-gradient(180deg, var(--amber-bright), var(--amber)); border:1px solid #7a5c1c;
    color:#211b08; box-shadow:0 3px 0 #7a5c1c, 0 6px 12px rgba(0,0,0,0.3);
  }
  .action-btn{
    background:linear-gradient(180deg, #9b51e0, #6c3483); border:1px solid #512e5f; color:#fff;
    box-shadow:0 3px 0 #4a235a, 0 6px 12px rgba(0,0,0,0.3); font-size:13px; padding:10px;
  }

  .rules-btn, .reset-btn{
    width:100%; margin-top:10px; padding:11px; background:transparent; border:1px solid var(--amber);
    color:var(--amber-bright); font-family:'Oswald', sans-serif; font-size:13px; font-weight:600;
    letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; border-radius:5px;
  }
  .reset-btn{ border-color:var(--line); color:var(--paper-dim); font-family:'IBM Plex Mono',monospace; font-size:11.5px; }

  .rules-content{ font-size:12.5px; line-height:1.5; color:var(--paper-dim); max-height:300px; overflow-y:auto; padding-right:4px; }
  .rules-content h3{ color:var(--amber-bright); font-family:'Oswald', sans-serif; margin:10px 0 4px; font-size:14px; }
  .rules-content ul{ margin-left:16px; margin-bottom:8px; }

  .brief-row{ display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .brief-row .k{ color:var(--paper-dim); text-transform:uppercase; font-size:11px;}
  .brief-row .v{ color:var(--amber-bright); font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; text-align:right;}
  
  .story-box, .crisis-box, .log-box{
    margin-top:10px; padding:10px 12px; background:rgba(0,0,0,0.25); border-left:3px solid var(--amber);
    font-size:12.5px; line-height:1.45; color:var(--paper-dim); border-radius:0 4px 4px 0;
  }
  .crisis-box{ background:rgba(168,58,42,0.15); border-left-color:var(--rust); color:var(--paper); }
  .crisis-title{ color:#f26d5b; font-family:'Oswald',sans-serif; font-size:13px; margin-bottom:3px; text-transform:uppercase;}
  .log-box{ background:rgba(133,65,217,0.12); border-left-color:var(--special-card); color:#d7bde2; font-size:11.5px; }

  .stamp{
    position:absolute; top:14px; right:16px; border:2px solid var(--rust); color:var(--rust);
    font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.1em;
    padding:4px 8px; border-radius:3px; transform:rotate(8deg); opacity:0.85;
  }

  .grid-wrap{ width:100%; max-width:1280px; margin-top:12px; }
  .grid-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 4px; font-size:15px; }
  .grid-title .n{ color:var(--amber-bright); }
  
  .timer-badge{
    background:var(--bg-panel); border:1px solid var(--amber); padding:6px 14px; border-radius:4px;
    font-family:'Oswald', sans-serif; font-size:16px; color:var(--amber-bright);
  }

  .grid{ display:grid; grid-template-columns: repeat(5, 1fr); gap:14px; width: 100%; }
  
  .card{
    background:linear-gradient(180deg,#26241a,#1c1b12); border:1px solid var(--line); border-radius:8px;
    padding:16px 14px; cursor:pointer; min-height:310px; display:flex; flex-direction:column;
    box-shadow:0 8px 16px -8px rgba(0,0,0,0.6); transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover { border-color: var(--amber); transform: translateY(-3px); }
  .card.eliminated{ opacity: 0.35; filter: grayscale(0.8); }
  .card .p-num{ font-family:'Big Shoulders Stencil', sans-serif; font-size:28px; color:var(--amber); line-height:1; }
  .card .p-status{ margin-top:4px; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--paper-dim); }
  .card.opened .p-status{ color:var(--amber-bright); }
  .card .hint{ font-size:10px; color:var(--paper-dim); margin-top:auto; text-align:right; }
  
  .traits{ display:none; margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .card.opened .traits{ display:block; }
  .card.opened .hint{ display:none; }
  
  .trait-row{ display:flex; justify-content:space-between; gap:8px; font-size:11.5px; padding:3px 0; }
  .trait-row .tk{ color:var(--paper-dim); }
  .trait-row .tv{ color:var(--paper); text-align:right; font-weight:500; }
  .trait-row .tv.secret-infected{ color: #ff6b6b; font-weight: 700; }
  .trait-row .tv.special-ability{ color: #b875ff; font-weight: 700; }

  .win-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-top:10px; width: 100%; }
  .win-card{
    background:linear-gradient(180deg,#26241a,#1c1b12); border:1px solid var(--line); border-radius:6px;
    padding:14px 10px; text-align:center; cursor:pointer; position:relative;
  }
  .win-card .wp-num{ font-family:'Big Shoulders Stencil', sans-serif; font-size:22px; color:var(--amber); }
  .win-card .wp-sub{ font-size:10px; color:var(--paper-dim); margin-top:3px; text-transform:uppercase; }
  .win-card.picked{ border-color:var(--amber-bright); box-shadow:0 0 0 2px var(--amber-bright); }
  .win-card.picked::after{ content:'\2713'; position:absolute; top:6px; right:8px; color:var(--amber-bright); font-size:12px; font-weight:700; }

  .result-wrap{ text-align:center; }
  .result-eyebrow{ color:var(--amber); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:8px; }
  .result-name{ font-family:'Big Shoulders Stencil', sans-serif; font-size:clamp(28px, 6vw, 40px); color:var(--paper); margin-bottom:6px; }
  
  footer{ margin-top:auto; padding-top:24px; color:var(--paper-dim); font-size:10px; text-align:center; opacity:0.6; }
  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  @media(max-width: 900px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { min-height: 220px; padding: 12px 10px; }
    .card .p-num { font-size: 22px; }
    .trait-row { font-size: 10.5px; }
    .grid-wrap { max-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Bitta Telefon uchun &middot; Aktiv Qobiliyatli Versiya</div>
  <h1 class="title stencil">BUNKER</h1>
  <div class="hazard"></div>
  <p class="subtitle">Navbatma-navbat telefonni olib dosiyelarni ko'ring, maxsus qobiliyatlarni ishga tushiring!</p>
</header>

<div class="wheel-wrap">
  <svg class="wheel" id="wheel" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#454330" stroke-width="6"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#d9a441" stroke-width="6" stroke-dasharray="10 14" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="14" fill="#201f16" stroke="#d9a441" stroke-width="3"/>
    <g stroke="#d9a441" stroke-width="5" stroke-linecap="round">
      <line x1="50" y1="8" x2="50" y2="22"/>
      <line x1="50" y1="78" x2="50" y2="92"/>
      <line x1="8" y1="50" x2="22" y2="50"/>
      <line x1="78" y1="50" x2="92" y2="50"/>
    </g>
  </svg>
</div>

<div id="app"></div>

<footer>BUNKER PROTOKOLI &middot; MAKTAB VA OILA UCHUN</footer>

<script>
(function(){
  var audioCtx = null;
  function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playBeep(freq, type, duration){
    try {
      initAudio();
      if(!audioCtx) return;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq || 440;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  var DATA = {
    profession:["Shifokor","Xirurg","Muhandis","Elektrik","O'qituvchi","Fermer","Harbiy","Duradgor","Oshpaz","Haydovchi","Politsiya","Psixolog","Arxitektor","Dasturchi","Kimyogar","Snayper","Santexnik","Veterinar","Advokat","Jurnalist","Dizayner","Uchuvchi","Dengizchi","Konchi","Sartarosh","Sotuvchi","Fitnes murabbiyi","Tarjimon","Aktyor","Musiqachi","Rassom","IT-mutaxassis","Bankir","Diplomat","Tikuvchi","Novvoy","O'rmonchi","Fotograf"],
    health:["Sog'lom","Astma kasalligi","Yurak yetishmovchiligi","Ko'zi ojiz","Qandli diabet","Bir oyog'i protez","Homilador","Eshitish past","Surunkali bosh og'rig'i","Chekuvchi","Immuniteti past","Umurtqa og'rig'i","Uyqusizlikdan aziyat","Bir qo'li jarohatlangan","Epilepsiya","Yuqori qon bosimi","Buyrak yetishmovchiligi","Teri allergiyasi","Barmoqlari shikastlangan","Jigar zaifligi","Kontuziya","Sil kasalligidan tuzalgan","Bronxial astma","Yurak aritmiyasi","Insultdan keyin yengil falaj","Ko'zoynaksiz ko'rmaydi"],
    phobia:["Klaustrofobiya (yopiq joy)","Akrofobiya (balandlik)","Nikofobiya (qorong'ulik)","Suvdan qo'rqish","Hasharotlardan qo'rqish","Odamlardan qo'rqish","Qondan qo'rqish","Yolg'izlikdan qo'rqish","Fobiyasi yo'q","Aerofobiya (uchish)","Itlardan qo'rqish","Ilonlardan qo'rqish","O'limdan qo'rqish","Kasal bo'lishdan qo'rqish","Baland ovozdan qo'rqish","Ignadan qo'rqish"],
    hobby:["Gitara chaladi","Bokschi","Rasm chizadi","Ov qiladi","Baliq tutadi","Oshpazlik sirini biladi","Dasturlash biladi","Tikuvchilik qiladi","Bog'dorchilik qiladi","Yozuvchi","Aktyorlik","Qurilish ishlari","Shaxmat ustaligi","Suzuvchi","Elektronika ustasi","Itlarni o'rgatadi","Poliglot (ko'p til biladi)","Temirchilik","Konservalash","Elektr tarmoqlari","Ov qurollarini sozlaydi","Xakerlik sirlari","Dorivor o'tlarni biladi","Tuzoq qura oladi","Mototsikl ta'mirlaydi"],
    trait:["Sodiq va ishonchli","Tez-tez yolg'on gapiradi","Tug'ma lider","Baxil (ochko'z)","Doim yordam beradi","Qo'rqoq","Topqir va hazilkash","Janjalkash","Xotirjam va sabrli","Shubhali","Har narsani biladi","Rejasi yo'q, lekin tavakkal qiladi","Sabrsiz","Doim shikoyat qiladi","Strategik fikrlaydi","Manipulyator","Mehribon","Qat'iyatli","Erkin ruhli"],
    item:["Dori-darmon qutisi","Urug'lar to'plami","Quyosh generatori","Radio stansiya","Ov miltig'i","Kitoblar to'plami","Suv tozalagich","Konserva (2 haftalik)","Chodir va xalta","Asboblar to'plami","Batareyalar","Tibbiyot entsiklopediyasi","Toza suv (20 litr)","Iliq kiyim","Pichoq va bolta","Gugurt/chaqmoq","Xarita va kompas","Quvvat banki","Portativ gaz plita","Benzin generatori","Radiatsiya filtri","Antibiotiklar","Tikuv mashinasi","O'q-dori","Bolta","Gaz niqobi"],
    specialCards: [
      { name: "🛡 Imunitet qalqoni", desc: "Ovoz berishda sizni chiqarib yuborsalar ham 1 marta qutulasiz." },
      { name: "🔍 Fosh qiluvchi", desc: "Boshqa o'yinchining kasbi yoki virusi bor-yo'qligini ko'rasiz." },
      { name: "🔄 Kasb almashinuvi", desc: "Boshqa o'yinchi bilan kasbingizni yashirincha almashtirasiz." },
      { name: "🛑 Sukunat", desc: "Muhokama paytida kimnidir 30 soniyaga ovozsiz qoldirasiz." },
      { name: "⭐ Ikki karra ovoz", desc: "Ovoz berishda sizning ovozingiz 2 ta bo'lib sanaladi." }
    ],
    catastrophe:[
      { name: "Yadroviy urush", story: "Strategik obektlarga zarba berilib, dunyo yadroviy qish og'ushida qoldi. Havo radioaktiv chang bilan qoplangan." },
      { name: "Zombi apokalipsisi", story: "Noma'lum virus odamlarni shafqatsiz yirtqichlarga aylantirdi. Shaharlar butunlay quladi." },
      { name: "Global pandemiya", story: "Laboratoriyadan sizib chiqqan o'ta xavfli patogen butun yer yuziga tarqaldi. Havo orqali yuqadi." },
      { name: "Meteorit qulashi", story: "Yerga ulkan osmon jismining urilishi natijasida quyosh nurlari oylar davomida ko'rinmay qoldi." }
    ],
    crises: [
      { title: "Kislorod taqchilligi!", desc: "Shamollatish tizimi shikastlandi. Zaxira muddati qisqartirildi." },
      { title: "Tashqi radiatsiya sizib chiqishi", desc: "Eshik yaqinida muhr buzildi. Himoya moslamasi zarur." },
      { title: "Vahima boshlandi", desc: "Ishtirokchilardan birida tushkunlik kuzatilmoqda." }
    ],
    supply:["6 oylik zaxira","1 yillik zaxira","18 oylik zaxira","2 yillik zaxira"]
  };

  var LABELS = { profession:"Kasbi", genderAge:"Jinsi / Yoshi", health:"Salomatligi", phobia:"Fobiyasi", hobby:"Qobiliyati", trait:"Xarakteri", item:"Buyumi", specialCard:"⭐ Maxsus Qobiliyat", secretStatus:"Holati" };
  var ORDER = ["genderAge","profession","health","phobia","hobby","trait","item","specialCard","secretStatus"];

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  var state = { count:null, players:[], catastrophe:null, crisis:null, supply:null, winners:[], gameLog: [] };
  var app = document.getElementById('app');
  var wheel = document.getElementById('wheel');
  var timerInterval = null;
  var timeLeft = 120;

  function renderSetup(){
    if(timerInterval) clearInterval(timerInterval);
    state = { count:null, players:[], catastrophe:null, crisis:null, supply:null, gameLog: [] };
    wheel.classList.remove('spin');
    var html = '';
    html += '<div class="panel fade-in"><div class="panel-label">O\'yinchi sonini tanlang</div>';
    html += '<div class="keypad" id="keypad">';
    for(var n=4;n<=10;n++){
      html += '<div class="key" data-n="'+n+'">'+n+'<span class="tag">kishi</span></div>';
    }
    html += '</div>';
    html += '<button class="go-btn" id="goBtn" disabled>Bunkerni boshlash</button>';
    html += '<button class="rules-btn" id="rulesBtn">O\'yin Qoidalari</button>';
    html += '</div>';
    app.innerHTML = html;

    var keys = app.querySelectorAll('.key');
    keys.forEach(function(k){
      k.addEventListener('click', function(){
        playBeep(600, 'triangle', 0.05);
        keys.forEach(function(x){ x.classList.remove('active'); });
        k.classList.add('active');
        state.count = parseInt(k.getAttribute('data-n'),10);
        document.getElementById('goBtn').disabled = false;
      });
    });
    document.getElementById('goBtn').addEventListener('click', function(){
      playBeep(400, 'square', 0.15);
      wheel.classList.add('spin');
      generateGame();
      setTimeout(renderBriefing, 550);
    });
    document.getElementById('rulesBtn').addEventListener('click', function(){
      playBeep(500, 'sine', 0.1);
      renderRules();
    });
  }

  function renderRules(){
    var html = '<div class="panel fade-in"><div class="panel-label">O\'yin Qoidalari & Aktiv Qobiliyatlar</div>';
    html += '<div class="rules-content">';
    html += '<h3>1. Bitta Telefonda O\'ynash</h3><p>Har bir o\'yinchi navbatma-navbat telefonni olib o\'z dosiyesini ochib ko\'radi va boshqalarga ko\'rsatmasdan yopib qo\'yadi.</p>';
    html += '<h3>2. Aktiv Maxsus Qobiliyatlar</h3><p>Har bir kartada maxsus qobiliyat bor. O\'yin davomida buni **"Qobiliyatni ishlatish"** tugmasi orqali faollashtirib, boshqa o\'yinchilarni tekshirish yoki kasb almashtirish mumkin!</p>';
    html += '<h3>3. Maqsad</h3><p>Jamoaviy muhokamada o\'zingizni eng kerakli shaxs sifatida ko\'rsatib, bunkerga kirishga harakat qiling.</p>';
    html += '</div>';
    html += '<button class="continue-btn" id="backToSetup">&larr; Orqaga</button></div>';
    app.innerHTML = html;
    document.getElementById('backToSetup').addEventListener('click', function(){ renderSetup(); });
  }

  function generateGame(){
    state.catastrophe = shuffle(DATA.catastrophe)[0];
    state.crisis = shuffle(DATA.crises)[0];
    state.supply = shuffle(DATA.supply)[0];
    
    var pools = {};
    ORDER.forEach(function(key){ if(key !== 'genderAge' && key !==
